<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biodata</title>
<style>
  :root{
    --bg:#f5f5f5; --card:#ffffff; --text:#222; --muted:#666; --line:#e5e5e5; --accent:#333;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .card{
    background:var(--card);
    width:100%;max-width:340px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:24px 20px;
  }
  .photo{
    width:100px;height:100px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 14px;
    background:#eee;
  }
  .photo img{width:100%;height:100%;object-fit:cover;}
  .name{
    text-align:center;
    font-size:18px;font-weight:bold;color:var(--text);
    margin-bottom:2px;
  }
  .role{
    text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;
  }
  table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  td{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;}
  td.label{color:var(--muted);width:80px;}
  td.value{color:var(--text);font-weight:bold;text-align:right;}
  .socials{text-align:center;}
  .socials a{
    display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;color:var(--accent);
    font-size:14px;border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;
  }
  .socials svg{width:16px;height:16px;fill:var(--accent);}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111; --card:#1b1b1b; --text:#eee; --muted:#999; --line:#333; --accent:#eee;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111; --card:#1b1b1b; --text:#eee; --muted:#999; --line:#333; --accent:#eee;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo">
      <img src="foto.jpg" alt="Foto profil">
    </div>
    <div class="name">Mangaraja Yuristyo Buwono</div>
    <div class="role">Mahasiswa</div>

    <table>
      <tr>
        <td class="label">Nama</td>
        <td class="value">Mangaraja Yuristyo Buwono</td>
      </tr>
      <tr>
        <td class="label">NIM</td>
        <td class="value">102042500151</td>
      </tr>
      <tr>
        <td class="label">Umur</td>
        <td class="value">19</td>
            <tr>
        <td class="label">Hobi</td>
        <td class="value">Main game</td>
      </tr>
    </table>

    <div class="socials">
      <a href="https://instagram.com/mngarjbb" target="_blank" rel="noopener">

  </div>
</body>
</html>
